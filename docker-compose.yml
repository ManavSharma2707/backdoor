name: backroom

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: backroom
      POSTGRES_PASSWORD: backroom
      POSTGRES_DB: backroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backroom -d backroom"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      target: dev
    command: >
      sh -c "python -m app.jobs.run migrate &&
      uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://backroom:backroom@db:5432/backroom
      WATCHFILES_FORCE_POLLING: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
